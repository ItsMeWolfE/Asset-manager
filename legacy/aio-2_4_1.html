REACT_DEVTOOLS_GLOBAL_HOOK__>"u"||typeof __REACT_DEVTOOLS_GLOBAL_HOOK__.checkDCE!="function"))try{__REACT_DEVTOOLS_GLOBAL_HOOK__.checkDCE(u)}catch(R){console.error(R)}}return u(),Jo.exports=id(),Jo.exports}var jf;function od(){if(jf)return ci;jf=1;var u=hu();return ci.createRoot=u.createRoot,ci.hydrateRoot=u.hydrateRoot,ci}var ld=od();const cd=ll(ld);const __bamAboutData={"en":{"title":"About this page","intro":["Bug Asset Manager is a single web page that gathers the five tools we use to get product content ready for the site. Everything runs inside your own browser: no file you open here is sent to a server, and closing the tab throws all of it away.","Pick a tool from the list on the side. The tools are independent of each other, so you can leave work half-finished in one, switch to another, and come back to it.","Most tools keep an event log at the bottom of the panel. If something looks stuck, or the result is not what you expected, the log says exactly what happened, line by line. Errors are shown in red."],"sections":[{"icon":"Crop","title":"Batch Cropper","tagline":"Strips the empty margin off product photos, in bulk.","groups":[{"h":"What it does","type":"p","items":["Supplier photos almost always arrive with a wide empty margin around the product, either transparent or a flat studio colour. This tool works out where the product starts and ends and cuts everything else away. It handles a whole batch at once and never touches the original files on your disk.","It recognises the background in two ways. If the image has transparency, it uses that. If the image is fully opaque, it samples eight points around the border, decides what the background colour is, and trims everything that matches it.","Small specks of JPEG noise clinging to the edge would otherwise stop it from cropping tightly, so anything tiny that touches the border is ignored."]},{"h":"How to use it","type":"ol","items":["Choose an output format. ZIP archive downloads one file called tight_cropped.zip with everything inside; Individual files downloads each cropped image on its own. For anything more than a handful, use ZIP, because browsers block long runs of downloads.","Choose a crop mode. Full crop cuts exactly to the edges of the product. Square (1:1) produces a perfect square with the product centred, which is what you want when the catalogue needs uniform thumbnails.","Drag images onto the dashed area, click Select images to browse for them, or simply paste an image from the clipboard with Ctrl+V while the panel is open.","Watch the progress bar. When it finishes, the downloads start on their own.","Clear completed state resets the panel for the next batch."]},{"h":"Worth knowing","type":"ul","items":["The output is WebP with transparency intact. Each file keeps its original name with a .webp extension; if two source files would end up with the same name, the second one becomes name_2.webp.","An image that is completely empty, with nothing but background in it, is skipped and noted in the log rather than turned into a blank file.","In square mode, if the square runs past the edge of the source photo, the missing strip is filled with the background colour the tool detected. A photo on white stays white; a transparent one stays transparent.","Nothing is uploaded. The trimming happens on your own machine, which is why a large batch keeps the processor busy."]}]},{"icon":"Resize","title":"Smart Resizer","tagline":"Places one image, exactly where you want it, inside a fixed canvas size.","groups":[{"h":"What it does","type":"p","items":["The cropper decides the output size for you. This tool is the opposite: you fix the output size first, say 264 by 248 for a Top Product slot, and then position the image inside it by hand. The result always comes out at exactly the dimensions you asked for."]},{"h":"How to use it","type":"ol","items":["Choose a canvas size. The built-in presets are Top Product 264×248, Square Small 100×100, Square Large 500×500, HD 1080p 1920×1080 and Story 1080×1920. You can also type a width and height of your own and save it as a preset.","Load an image by dragging it in, clicking Select image, or pasting.","Fit shrinks the image until all of it is visible inside the canvas, leaving empty space around it. Fill enlarges it until it covers the canvas edge to edge, cutting off whatever hangs over.","Drag the image to move it. It snaps to the horizontal and vertical centre, and dashed guides appear when it is aligned.","Use the scale slider for fine adjustment.","Under Background, Transparent leaves the empty area see-through, or you can pick a colour.","Download result produces a file whose name includes the dimensions, for example photo-264x248.webp."]},{"h":"Worth knowing","type":"ul","items":["Start over clears the image but keeps your canvas size.","Delete preset permanently removes the selected preset, including the built-in ones. There is no undo, so take care with it.","Presets are saved in this browser only. On another computer, or after clearing the browser, you are back to the defaults."]}]},{"icon":"FileText","title":"HTML Cleaner","tagline":"Turns a supplier's messy description HTML into something safe to paste into the site.","groups":[{"h":"What it does","type":"p","items":["Product descriptions from suppliers arrive full of things the site cannot use: their own fonts and colours, nested layout containers, scripts, tracking frames and leftovers from Word. This tool removes all of that and rebuilds the description as a flat sequence of paragraphs.","Anything dangerous is stripped outright: scripts, stylesheets, embedded frames, form fields and embedded objects.","The structure is flattened. Containers, sections, lists and list items all become plain paragraphs. Headings become bold paragraphs and keep their wording. Bold tags are normalised and span wrappers are removed.","Tables survive as tables, because a specification table is usually the most useful part of a description. Images and videos survive too. Empty paragraphs left behind by the flattening are dropped."]},{"h":"How to use it","type":"ol","items":["Paste into the input pane. Visual mode takes formatted content pasted straight from a supplier's page or a Word document. Code mode is for pasting raw HTML.","The output pane updates as you type, after a short pause. Visual shows what it will look like; Code shows the HTML you will paste into the CMS.","Copy copies whatever the output pane is currently showing: formatted content from Visual, raw source from Code.","Clear empties both panes."]},{"h":"Worth knowing","type":"ul","items":["The code panes always read left to right, even in Hebrew, because markup is read that way.","Alt text that images already carry is left exactly as it was.","Nothing is downloaded. Images keep whichever address the supplier used, so if their images sit on their own server you still need to save them and host them yourself."]}]},{"icon":"Table","title":"Dragon Fixer","tagline":"Turns a Dragon stock export into the two-column file the import expects.","groups":[{"h":"What it does","type":"p","items":["Dragon exports a wide spreadsheet with many columns. The import only needs two of them: the barcode and a stock number. This tool finds those columns, converts the availability wording into the numbers the import expects, and writes a clean file.","It reads the first worksheet and looks for a header row that contains both a barcode column and an availability column. Everything below that row is treated as data.","Availability is translated: in-stock wording, or the number 10, becomes 10; out-of-stock wording, or the number 9, becomes 9. Rows with anything else in that column are left out.","Rows whose barcode is blank, contains Hebrew letters, or has no digit at all are skipped. That is how subtotal and section rows get filtered out."]},{"h":"How to use it","type":"ol","items":["Set the stock filter. All products exports everything, In stock (10) exports only what is in stock, and Out of stock (9) exports only what has run out.","Drag the Dragon file in, or click Select spreadsheet. XLSX, XLS and CSV are accepted.","The download starts on its own, named after the original file with _dragon_fixed.xlsx added."]},{"h":"Worth knowing","type":"ul","items":["The output has no header row, just the barcode in column A and 10 or 9 in column B, which is exactly what the import expects.","The header names have to match exactly. If Dragon ever changes the headers in its export, the tool will tell you it could not find them instead of guessing.","The filter is applied at the moment the file is processed, so set it before loading. Changing it afterwards means loading the file again."]}]},{"icon":"BadgeDollar","title":"Price XLSX Fixer","tagline":"Pulls item codes and updated prices out of any supplier price list.","groups":[{"h":"What it does","type":"p","items":["Suppliers send price updates in whatever shape they feel like: different worksheets, headers three rows down, twenty columns of which two matter. This tool reads the whole workbook, scores every header cell it finds, and picks the item-code column and the updated consumer-price column that fit best.","For item codes it prefers the standard item-code heading, then item number, then the catalogue-number abbreviation, then product code, and only falls back to barcode. Headings that mention the supplier or the manufacturer are rejected on purpose, because a supplier's own internal code is not our item code.","For prices it favours the column that looks the most recent: a consumer-price heading combined with a word meaning new or updated scores highest, then a consumer-price heading combined with a month name, and a plain consumer price below that. When several price columns compete, the log says how many candidates it passed over.","Every cell in the output is written as text, so long codes keep their leading zeros and never turn into something like 7.29E+12."]},{"h":"How to use it","type":"ol","items":["Use Upload file for a workbook, or Paste table to paste rows straight out of Excel or off a web page.","Read the log. It names the worksheet and header row it used and the two column headings it chose. Check them; this is the step worth ten seconds of your attention.","Generate XLSX downloads the result, named after the original file with _price_fixed.xlsx added."]},{"h":"Worth knowing","type":"ul","items":["The output has two columns and no headers: the item code, then the price.","Rows where only one of the two values is present are skipped and counted in the log.","If the log warns that item codes were stored as unsafe large numbers, it means Excel had already rounded them in the source file before you ever opened it. The fix is to ask the supplier to send the codes as text; nothing this tool does afterwards can bring back the lost digits."]}]},{"icon":"Settings","title":"Settings and accessibility","tagline":"Language, theme and text size.","groups":[{"h":"What it does","type":"ul","items":["The gear icon in the top bar opens the preferences panel: language (English or Hebrew), theme (six of them, from dark through to high contrast), text size (four steps) and the accent colour.","Every setting is saved in this browser, so it is waiting for you next time. On another computer you start from the defaults.","Changing the language reloads the tools, so finish anything you have in progress before switching.","The text size scales the spacing and the controls as well, not just the letters."]}]},{"icon":"Refresh","title":"If something goes wrong","tagline":"Where to look first.","groups":[{"h":"What to check","type":"ul","items":["Every tool that processes files keeps an event log. Red lines are errors, and they name which file failed and why.","No tool here talks to a server, so a failure is always about the file, never about the network.","Refreshing the page is completely safe. It only clears what is currently on screen, and never touches files on your computer or your saved preferences.","If a tool refuses a file, open it in Excel or an image viewer first. A file that will not open there will not open here either."]}]}]},"he":{"title":"אודות העמוד","intro":["Bug Asset Manager הוא עמוד אינטרנט אחד שמרכז את חמשת הכלים שבהם אנחנו משתמשים כדי להכין תוכן מוצרים לאתר. כל העיבוד מתבצע בתוך הדפדפן שלך: שום קובץ שנפתח כאן לא נשלח לשרת, וסגירת הלשונית מוחקת הכול.","בוחרים כלי מהרשימה שבצד. הכלים עצמאיים זה מזה, כך שאפשר להשאיר עבודה באמצע בכלי אחד, לעבור לכלי אחר, ולחזור אליה אחר כך.","לרוב הכלים יש יומן אירועים בתחתית הפאנל. אם משהו נראה תקוע, או שהתוצאה אינה כמצופה, היומן מפרט בדיוק מה קרה, שורה אחר שורה. שגיאות מופיעות באדום."],"sections":[{"icon":"Crop","title":"חיתוך אצווה","tagline":"מסיר את השוליים הריקים מתמונות מוצר, בכמויות גדולות.","groups":[{"h":"מה הכלי עושה","type":"p","items":["תמונות מספקים מגיעות כמעט תמיד עם שוליים ריקים רחבים סביב המוצר, שקופים או בצבע אחיד של רקע צילום. הכלי מזהה היכן המוצר מתחיל ונגמר וחותך את כל השאר. הוא מטפל באצווה שלמה בבת אחת ואינו נוגע בקבצים המקוריים שבמחשב.","זיהוי הרקע נעשה בשתי דרכים. אם בתמונה יש שקיפות, הכלי משתמש בה. אם התמונה אטומה לגמרי, הוא דוגם שמונה נקודות לאורך המסגרת, מחליט מהו צבע הרקע, וחותך כל מה שתואם לו.","נקודות רעש קטנות שנדבקות לשוליים בקובצי JPEG היו מונעות חיתוך צמוד, ולכן הכלי מתעלם מכל רכיב זעיר שנוגע במסגרת."]},{"h":"איך משתמשים","type":"ol","items":["בוחרים תבנית פלט. ארכיון ZIP מוריד קובץ אחד בשם tight_cropped.zip עם הכול בתוכו, ואילו קבצים בודדים מוריד כל תמונה בנפרד. לכמות גדולה עדיף ZIP, מפני שדפדפנים חוסמים רצף ארוך של הורדות.","בוחרים אופן חיתוך. חיתוך מלא חותך בדיוק לקצוות המוצר. ריבוע (1:1) מפיק ריבוע מושלם עם המוצר במרכז, וזה מה שצריך כשהקטלוג דורש תמונות ממוזערות אחידות.","גוררים תמונות אל המסגרת המקווקוות, לוחצים על בחירת תמונות כדי לאתר אותן, או פשוט מדביקים תמונה מהלוח באמצעות Ctrl+V כשהפאנל פתוח.","עוקבים אחר סרגל ההתקדמות. בסיום ההורדות מתחילות מעצמן.","ניקוי מצב הסיום מאפס את הפאנל לקראת האצווה הבאה."]},{"h":"כדאי לדעת","type":"ul","items":["הפלט הוא WebP עם שקיפות מלאה. כל קובץ שומר על שמו המקורי עם הסיומת webp. אם שני קבצים היו מקבלים אותו שם, השני מקבל תוספת של מספר לשמו.","תמונה ריקה לגמרי, שאין בה דבר מלבד רקע, מדולגת ונרשמת ביומן במקום להפוך לקובץ ריק.","במצב ריבוע, אם הריבוע חורג מגבולות התמונה המקורית, הרצועה החסרה מתמלאת בצבע הרקע שהכלי זיהה. תמונה על רקע לבן נשארת לבנה, ותמונה שקופה נשארת שקופה.","שום דבר אינו נשלח לשרת. החיתוך מתבצע במחשב שלך, ולכן אצווה גדולה מעסיקה את המעבד."]}]},{"icon":"Resize","title":"שינוי גודל חכם","tagline":"ממקם תמונה אחת, בדיוק במקום הרצוי, בתוך קנבס בגודל קבוע.","groups":[{"h":"מה הכלי עושה","type":"p","items":["כלי החיתוך קובע את גודל הפלט בשבילך. הכלי הזה עושה בדיוק את ההפך: קודם קובעים את גודל הפלט, למשל 264 על 248 למשבצת של מוצר מוביל, ואז ממקמים את התמונה בתוכו ידנית. התוצאה יוצאת תמיד במידות המדויקות שביקשת."]},{"h":"איך משתמשים","type":"ol","items":["בוחרים גודל קנבס. התבניות המובנות הן מוצר מוביל 264×248, ריבוע קטן 100×100, ריבוע גדול 500×500, ‏HD 1080p בגודל 1920×1080, וסטורי 1080×1920. אפשר גם להקליד רוחב וגובה משלך ולשמור אותם כתבנית.","טוענים תמונה בגרירה, בלחיצה על בחירת תמונה, או בהדבקה.","התאמה מקטינה את התמונה עד שכולה נראית בתוך הקנבס ומשאירה סביבה שטח ריק. מילוי מגדילה אותה עד שהיא מכסה את הקנבס מקצה לקצה, וחותכת את מה שחורג.","גוררים את התמונה כדי להזיז אותה. היא נצמדת למרכז האופקי והאנכי, וקווי עזר מקווקווים מופיעים כשהיא מיושרת.","מחוון קנה המידה משמש לכוונון עדין.","תחת רקע, האפשרות שקוף משאירה את השטח הריק שקוף, ואפשר גם לבחור צבע.","הורדת התוצאה מפיקה קובץ ששמו כולל את המידות, למשל photo-264x248.webp."]},{"h":"כדאי לדעת","type":"ul","items":["התחלה מחדש מנקה את התמונה אך שומרת על גודל הקנבס.","מחיקת תבנית מוחקת לצמיתות את התבנית הנבחרת, כולל התבניות המובנות. אין אפשרות ביטול, ולכן כדאי להיזהר.","התבניות נשמרות בדפדפן הזה בלבד. במחשב אחר, או אחרי ניקוי נתוני הדפדפן, חוזרים לברירות המחדל."]}]},{"icon":"FileText","title":"מנקה HTML","tagline":"הופך HTML מבולגן של תיאור ספק למשהו שבטוח להדביק לאתר.","groups":[{"h":"מה הכלי עושה","type":"p","items":["תיאורי מוצר מספקים מגיעים מלאים בדברים שהאתר אינו יכול להשתמש בהם: גופנים וצבעים משלהם, מעטפות עיצוב מקוננות, סקריפטים, מסגרות מעקב ושאריות של Word. הכלי מסיר את כל אלה ובונה מחדש את התיאור כרצף שטוח של פסקאות.","כל מה שמסוכן מוסר לחלוטין: סקריפטים, גיליונות עיצוב, מסגרות מוטמעות, שדות טופס ואובייקטים מוטמעים.","המבנה משוטח. מעטפות, מקטעים, רשימות ופריטי רשימה הופכים כולם לפסקאות רגילות. כותרות הופכות לפסקאות מודגשות ושומרות על הניסוח שלהן. תגי הדגשה מנורמלים ומעטפות span מוסרות.","טבלאות נשמרות כטבלאות, מפני שטבלת מפרט היא בדרך כלל החלק השימושי ביותר בתיאור. גם תמונות וסרטונים נשמרים. פסקאות ריקות שנוצרו בתהליך השיטוח נמחקות."]},{"h":"איך משתמשים","type":"ol","items":["מדביקים בחלונית הקלט. מצב ויזואלי מקבל תוכן מעוצב שהודבק ישירות מעמוד של ספק או ממסמך Word. מצב קוד מיועד להדבקה של HTML גולמי.","חלונית הפלט מתעדכנת תוך כדי הקלדה, לאחר השהיה קצרה. ויזואלי מראה כיצד זה ייראה, וקוד מראה את ה-HTML שתדביק למערכת התוכן.","העתקה מעתיקה את מה שמוצג כרגע בחלונית הפלט: תוכן מעוצב ממצב ויזואלי, וקוד גולמי ממצב קוד.","ניקוי מרוקן את שתי החלוניות."]},{"h":"כדאי לדעת","type":"ul","items":["חלוניות הקוד מוצגות תמיד משמאל לימין, גם בעברית, מפני שכך קוראים קוד.","טקסט חלופי שכבר קיים בתמונות נשאר בדיוק כפי שהיה.","הכלי אינו מוריד דבר. תמונות נשארות עם הכתובת שהספק נתן, ולכן אם התמונות מאוחסנות בשרת של הספק עדיין צריך לשמור אותן ולארח אותן אצלנו."]}]},{"icon":"Table","title":"מתקן Dragon","tagline":"הופך ייצוא מלאי מ-Dragon לקובץ בן שתי עמודות שהייבוא מצפה לו.","groups":[{"h":"מה הכלי עושה","type":"p","items":["Dragon מייצא גיליון רחב עם עמודות רבות. הייבוא זקוק רק לשתיים מהן: הברקוד ומספר המלאי. הכלי מאתר את העמודות האלה, ממיר את נוסח הזמינות למספרים שהייבוא מצפה להם, וכותב קובץ נקי.","הוא קורא את הגיליון הראשון ומחפש שורת כותרות שיש בה גם עמודת ברקוד וגם עמודת זמינות. כל מה שמתחת לשורה הזאת נחשב לנתונים.","הזמינות מתורגמת: הנוסח שמציין קיום במלאי, או המספר 10, הופך ל-10; הנוסח שמציין חוסר, או המספר 9, הופך ל-9. שורות שיש בעמודה הזאת ערך אחר אינן נכללות.","שורות שהברקוד בהן ריק, מכיל אותיות בעברית, או אינו מכיל ולו ספרה אחת, מדולגות. כך מסוננות שורות סיכום ושורות כותרת ביניים."]},{"h":"איך משתמשים","type":"ol","items":["קובעים את מסנן המלאי. כל המוצרים מייצא הכול, יש מלאי (10) מייצא רק את מה שקיים במלאי, ואין מלאי (9) מייצא רק את מה שאזל.","גוררים את קובץ Dragon פנימה, או לוחצים על בחירת גיליון. נתמכים XLSX, ‏XLS ו-CSV.","ההורדה מתחילה מעצמה, בשם הקובץ המקורי עם תוספת שמציינת שהקובץ תוקן."]},{"h":"כדאי לדעת","type":"ul","items":["בפלט אין שורת כותרות, רק הברקוד בעמודה A והמספר 10 או 9 בעמודה B, בדיוק כפי שהייבוא מצפה.","שמות הכותרות חייבים להיות מדויקים. אם Dragon ישנה בעתיד את הכותרות בייצוא, הכלי יודיע שלא מצא אותן במקום לנחש.","המסנן פועל ברגע עיבוד הקובץ, ולכן כדאי לקבוע אותו לפני הטעינה. שינוי לאחר מכן מחייב לטעון את הקובץ מחדש."]}]},{"icon":"BadgeDollar","title":"מתקן מחירים XLSX","tagline":"שולף קודי פריט ומחירים מעודכנים מכל מחירון של ספק.","groups":[{"h":"מה הכלי עושה","type":"p","items":["ספקים שולחים עדכוני מחיר בכל צורה שנוחה להם: גיליונות שונים, כותרות בשורה השלישית, עשרים עמודות שמתוכן שתיים חשובות. הכלי קורא את כל חוברת העבודה, מנקד כל תא כותרת שהוא מוצא, ובוחר את עמודת קוד הפריט ואת עמודת מחיר הצרכן המעודכן שמתאימות ביותר.","בקודי פריט הוא מעדיף את הכותרת קוד פריט, אחריה מספר פריט, אחריה מק״ט, אחריה קוד מוצר, ורק כמוצא אחרון ברקוד. כותרות שמזכירות ספק או יצרן נפסלות בכוונה, מפני שהקוד הפנימי של הספק אינו קוד הפריט שלנו.","במחירים הוא מעדיף את העמודה שנראית העדכנית ביותר: כותרת של מחיר צרכן יחד עם מילה שמציינת חדש או מעודכן מקבלת את הניקוד הגבוה ביותר, אחריה כותרת של מחיר צרכן יחד עם שם חודש, ומתחת לזה מחיר צרכן רגיל. כשיש כמה עמודות מחיר מתחרות, היומן מציין על כמה מועמדות הכלי ויתר.","כל תא בפלט נכתב כטקסט, כדי שקודים ארוכים ישמרו על האפסים המובילים שלהם ולא יהפכו למשהו כמו 7.29E+12."]},{"h":"איך משתמשים","type":"ol","items":["משתמשים בהעלאת קובץ עבור חוברת עבודה, או בהדבקת טבלה כדי להדביק שורות ישירות מ-Excel או מדף אינטרנט.","קוראים את היומן. הוא מציין באיזה גיליון ובאיזו שורת כותרות השתמש ואילו שתי כות .prose{color:var(--text-main);line-height:1.65}
