name: Deploy to GitHub Pages

# The app has no build step, so this uploads the repository as-is.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish; queue at most one more.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # A version mismatch would tell clients an update exists that the
      # service worker then refuses to install, so fail the deploy instead.
      - name: Versions must agree
        run: |
          json=$(grep -oP '"version":\s*"\K[^"]+' version.json)
          app=$(grep -oP "APP_VERSION = '\K[^']+" assets/js/core/version.js)
          sw=$(grep -oP "CACHE_VERSION = '\K[^']+" sw.js)
          echo "version.json=$json  version.js=$app  sw.js=$sw"
          if [ "$json" != "$app" ] || [ "$json" != "$sw" ]; then
            echo "::error::Version mismatch. Use tools/release.sh instead of editing by hand."
            exit 1
          fi

  deploy:
    needs: check
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - id: deployment
        uses: actions/deploy-pages@v4
