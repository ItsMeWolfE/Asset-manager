<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />

    <title>Asset Manager</title>

    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='5' fill='%235b6df8'/%3E%3Cpath d='M12 5l7 3.5-7 3.5-7-3.5z M5 15l7 3.5 7-3.5 M5 11.5l7 3.5 7-3.5' fill='none' stroke='white' stroke-width='1.6' stroke-linejoin='round'/%3E%3C/svg%3E" />

    <!--
      Launcher. The one file to double-click. Copy it anywhere - desktop, shared
      drive, email attachment - it does nothing but open the hosted app.

      There is deliberately no copy of the app inside this file. A page opened
      from file:// cannot register a service worker or overwrite itself on disk,
      so a self-contained build can never update: it is stale the day it ships.
      Pointing at the hosted app instead means whoever opens this always gets
      the current version.

      If the deployment ever moves, the URL below is the only thing to change.
    -->
    <meta http-equiv="refresh" content="0; url=https://itsmewolfe.github.io/Asset-manager/" />

    <style>
      :root { color-scheme: dark light; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #10131a;
        color: #cbd3df;
        font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
        text-align: center;
      }
      main { padding: 24px; max-width: 32rem; }
      h1 { font-size: 1.25rem; color: #f4f7fb; margin: 0 0 12px; }
      p { margin: 12px 0; line-height: 1.6; }
      a { color: #5b6df8; }
      .hint { font-size: 0.875rem; color: #8b95a7; }
    </style>
  </head>

  <body>
    <main>
      <h1>Asset Manager</h1>
      <p>Opening the app&hellip;</p>
      <p><a id="go" href="https://itsmewolfe.github.io/Asset-manager/">itsmewolfe.github.io/Asset-manager</a></p>
      <p class="hint">
        If nothing happens, click the link above. It needs a connection the
        first time; after that it keeps working offline in the same browser.
      </p>
    </main>

    <script>
      // replace() rather than assigning href: the launcher should not sit in
      // history, or Back from the app would bounce straight through it again.
      location.replace(document.getElementById('go').href);
    </script>
  </body>
</html>
